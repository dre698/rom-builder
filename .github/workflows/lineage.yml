name: Build LineageOS 20 Blossom

on:
  workflow_dispatch:

jobs:
  build_rom:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repo Pembangun
      uses: actions/checkout@v4

    - name: Kirim Notifikasi Mulai ke Telegram
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
        -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
        -d text="🚀 Build Started! Device: Blossom | ROM: LineageOS 20 (A13) | Status: Preparing..."

    - name: Maximize Disk Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 4096
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Cek Disk & Memory
      run: |
        sudo sysctl vm.swappiness=10
        df -h
        free -h

    - name: Pasang Paket Dependensi Build System
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list
        sudo sed -i 's|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list
        sudo apt update
        sudo apt install -y -o Dpkg::Options::="--force-confnew" \
          bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git git-lfs gnupg gperf lib32readline-dev lib32z1-dev libelf-dev \
          liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop \
          pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
          python3 openjdk-17-jdk

    - name: Pasang Google Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Setel Identitas Git
      run: |
        git config --global user.name "dre698-bot"
        git config --global user.email "dre698@github.local"

    - name: Sync Source Android & Manifest Lokal Blossom
      run: |
        mkdir -p $GITHUB_WORKSPACE/rom && cd $GITHUB_WORKSPACE/rom

        repo init \
          -u https://github.com/LineageOS/android.git \
          -b lineage-20.0 \
          --depth=1 \
          --groups=default,-darwin,-notdefault

        mkdir -p .repo/local_manifests
        cat <<EOF > .repo/local_manifests/blossom.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project name="dre698/device_xiaomi_blossom"
                   path="device/xiaomi/blossom"
                   remote="github"
                   revision="lineage-20" />
          <project name="dre698/proprietary_vendor_xiaomi_blossom"
                   path="vendor/xiaomi/blossom"
                   remote="github"
                   revision="lineage-20" />
          <project name="dre698/device_xiaomi_blossom-kernel"
                   path="device/xiaomi/blossom-kernel"
                   remote="github"
                   revision="lineage-20" />
          <project name="LineageOS/android_device_mediatek_sepolicy_vndr"
                   path="device/mediatek/sepolicy_vndr"
                   remote="github"
                   revision="lineage-20" />
        </manifest>
        EOF

        repo sync -c -j$(nproc --all) \
          --force-sync \
          --no-clone-bundle \
          --no-tags \
          --optimized-fetch \
          --no-repo-verify \
          -f

    - name: Cek Sisa Disk Sebelum Build
      run: |
        echo "=== Disk Usage ==="
        df -h
        echo "=== Memory ==="
        free -h

    - name: Jalankan Proses Kompilasi ROM
      run: |
        cd $GITHUB_WORKSPACE/rom

        export USE_CCACHE=0
        export SOONG_MAX_PARALLELISM=4
        export ALLOW_MISSING_DEPENDENCIES=true

        source build/envsetup.sh
        lunch lineage_blossom-userdebug

        make bacon -j$(nproc --all) 2>&1 | tee $GITHUB_WORKSPACE/build.log

    - name: Unggah Berkas Hasil Build (.zip ROM)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: LineageOS-20-Blossom
        path: rom/out/target/product/blossom/*.zip
        retention-days: 7

    - name: Pemrosesan Akhir Notifikasi & Berkas Telegram
      if: always()
      run: |
        CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
        TOKEN="${{ secrets.TELEGRAM_TOKEN }}"

        if [ "${{ job.status }}" == "success" ]; then
          ROM_FILE=$(ls $GITHUB_WORKSPACE/rom/out/target/product/blossom/*.zip 2>/dev/null | head -n 1)
          ROM_NAME=$(basename "$ROM_FILE")

          DOWNLOAD_URL=$(curl -T "$ROM_FILE" "https://bashupload.com/$ROM_NAME")

          CAPTION=$(printf "✅ Build Succeeded!\nDevice: Blossom (LineageOS 20 / A13)\nFile: %s\n\n📥 Download:\n%s" "$ROM_NAME" "$DOWNLOAD_URL")
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT" \
            -d text="$CAPTION"
        else
          LOG_FILE="$GITHUB_WORKSPACE/build.log"
          if [ ! -f "$LOG_FILE" ]; then
            LOG_FILE="$GITHUB_WORKSPACE/rom/out/error.log"
          fi

          if [ -f "$LOG_FILE" ]; then
            tail -n 300 "$LOG_FILE" > /tmp/error_tail.log
            curl -s -F chat_id="$CHAT" \
              -F document=@/tmp/error_tail.log \
              -F caption="❌ Build Failed! Blossom (A13) — Log 300 baris terakhir terlampir." \
              "https://api.telegram.org/bot${TOKEN}/sendDocument"
          else
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d chat_id="$CHAT" \
              -d text="❌ Build Failed! Blossom (A13) — Tidak ada log tersedia."
          fi
        fi
