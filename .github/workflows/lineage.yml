name: Build LineageOS 21 Blossom

on:
  workflow_dispatch: # Memunculkan tombol manual di GitHub Actions HP

jobs:
  build_rom:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repo Pembangun
      uses: actions/checkout@v4

    - name: Kirim Notifikasi Mulai ke Telegram
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
        -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
        -d text="🚀 Build Started! Device: Blossom | Status: Aggressive cleanup & maximizing space..."

    - name: Pembersihan Agresif Software Bawaan Runner
      run: |
        echo "=== Storage Sebelum Pembersihan Manual ==="
        df -h
        
        # Menghapus software besar bawaan runner yang tidak dibutuhkan compiler ROM
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/share/swift
        
        echo "=== Storage Setelah Pembersihan Manual ==="
        df -h

    - name: Maksimalkan Ruang Penyimpanan Server
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 8192  # Menyisakan 8GB di root agar apt install aman
        swap-size-mb: 1024
        build-mount-path: '/work' # Jalur mount LVM berkapasitas maksimal (~140GB+)
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Cek Kapasitas Akhir Disk
      run: |
        echo "=== Kapasitas Akhir di Jalur /work ==="
        df -h /work
        free -m

    - name: Pasang Paket Dependensi Build System
      run: |
        sudo apt update
        sudo apt install -y bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 openjdk-17-jdk

    - name: Pasang Google Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Setel Identitas Git
      run: |
        git config --global user.name "dre698-bot"
        git config --global user.email "dre698@github.local"

    - name: Sync Source Android & Manifest Lokal Blossom
      run: |
        # Mengatur kepemilikan agar runner leluasa menulis file di LVM
        sudo chown -R runner:runner /work
        cd /work
        mkdir -p rom && cd rom
        
        # Inisialisasi base ROM LineageOS 21 (Android 14) dengan kedalaman minimal
        repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs --depth=1
        
        # Buat folder manifest lokal
        mkdir -p .repo/local_manifests
        
        # Injeksi manifes terpadu Blossom
        cat <<EOF > .repo/local_manifests/blossom.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project name="dre698/device_xiaomi_blossom" path="device/xiaomi/blossom" remote="github" revision="staging/lineage-21" />
          <project name="dre698/proprietary_vendor_xiaomi_blossom" path="vendor/xiaomi/blossom" remote="github" revision="fourteen" />
          <project name="dre698/device_xiaomi_blossom-kernel" path="kernel/xiaomi/blossom" remote="github" revision="fourteen" />
        </manifest>
        EOF
        
        # Jalankan sinkronisasi kode
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

    - name: Jalankan Proses Kompilasi ROM
      run: |
        cd /work/rom
        
        # Matikan penggunaan ccache agar tidak membuat duplikat file yang menghabiskan memori disk
        export USE_CCACHE=0
        
        source build/envsetup.sh
        
        # Menyiapkan target untuk unified Blossom
        lunch lineage_blossom-userdebug
        
        # Mulai proses kompilasi zip ROM, output log diarahkan ke build.log di repositori utama
        brunch blossom 2>&1 | tee $GITHUB_WORKSPACE/build.log

    - name: Unggah Berkas Hasil Build (.zip ROM)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: LineageOS-21-Blossom
        path: /work/rom/out/target/product/blossom/*.zip

    - name: Pemrosesan Akhir Notifikasi & Berkas Telegram
      if: always()
      run: |
        CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
        TOKEN="${{ secrets.TELEGRAM_TOKEN }}"
        
        if [ "${{ job.status }}" == "success" ]; then
          ROM_FILE=$(ls /work/rom/out/target/product/blossom/*.zip | head -n 1)
          ROM_NAME=$(basename "$ROM_FILE")
          
          echo "Mengunggah $ROM_NAME ke server temporary cloud..."
          DOWNLOAD_URL=$(curl -T "$ROM_FILE" "https://bashupload.com/$ROM_NAME")
          
          CAPTION=$(printf "✅ Build Succeeded!\nDevice: Blossom\nFile: %s\n\n📥 Download Link:\n%s" "$ROM_NAME" "$DOWNLOAD_URL")
          
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT" \
            -d text="$CAPTION"
        else
          # Jika gagal, siapkan berkas log
          if [ ! -f "$GITHUB_WORKSPACE/build.log" ]; then
            if [ -f "/work/rom/out/error.log" ]; then
              cp /work/rom/out/error.log $GITHUB_WORKSPACE/build.log
            else
              echo "Build stopped early. Checking last lines:" > $GITHUB_WORKSPACE/build.log
              if [ -d "/work/rom" ]; then
                tail -n 100 /work/rom/.repo/repo.log 2>/dev/null >> $GITHUB_WORKSPACE/build.log || echo "No repo logs found." >> $GITHUB_WORKSPACE/build.log
              fi
            fi
          fi
          
          curl -s -F chat_id="$CHAT" \
            -F document=@$GITHUB_WORKSPACE/build.log \
            -F caption="❌ Build failed for Blossom. Check the attached log for core errors." \
            "https://api.telegram.org/bot${TOKEN}/sendDocument"
        fi
