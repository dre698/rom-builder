name: Build LineageOS 21 Blossom

on:
  workflow_dispatch: # Memunculkan tombol manual di GitHub Actions HP

jobs:
  build_rom:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repo Pembangun
      uses: actions/checkout@v4

    - name: Kirim Notifikasi Mulai ke Telegram
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
        -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
        -d text="🚀 Build Started! Device: Blossom | Compiler: dre698-bot | Status: Cleaning server & checking disk space..."

    - name: Bersihkan Storage Server Secara Agresif & Cek Sisa Penyimpanan
      run: |
        echo "=== PENYIMPANAN SEBELUM DIBERSIHKAN ==="
        df -h
        echo "======================================="
        
        # Hapus runtime masif bawaan GitHub runner untuk mengosongkan ~30GB+ ruang disk
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/local/lib/node_modules
        sudo rm -rf /opt/pipx
        sudo docker image prune -a -f
        sudo apt-get clean
        
        echo "=== PENYIMPANAN SETELAH DIBERSIHKAN ==="
        df -h
        echo "======================================="

    - name: Pasang Paket Dependensi Build System
      run: |
        sudo apt update
        sudo apt install -y bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 openjdk-17-jdk

    - name: Pasang Google Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Setel Identitas Git
      run: |
        git config --global user.name "dre698-bot"
        git config --global user.email "dre698@github.local"

    - name: Sync Source Android & Manifest Lokal Blossom
      run: |
        mkdir rom && cd rom
        # Inisialisasi base ROM LineageOS 21 (Android 14)
        repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs --depth=1
        
        # Buat folder manifest lokal
        mkdir -p .repo/local_manifests
        
        # Injeksi manifes terpadu Blossom langsung mengarah ke branch valid di akunmu (dre698)
        cat <<EOF > .repo/local_manifests/blossom.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project name="dre698/device_xiaomi_blossom" path="device/xiaomi/blossom" remote="github" revision="staging/lineage-21" />
          <project name="dre698/proprietary_vendor_xiaomi_blossom" path="vendor/xiaomi/blossom" remote="github" revision="fourteen" />
          <project name="dre698/device_xiaomi_blossom-kernel" path="kernel/xiaomi/blossom" remote="github" revision="fourteen" />
        </manifest>
        EOF
        
        # Jalankan proses sinkronisasi kode dengan jumlah thread yang dibatasi (-j4) agar RAM tidak jebol,
        # serta menambahkan opsi --no-tags demi menghemat ruang penyimpanan.
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

    - name: Jalankan Proses Kompilasi ROM
      run: |
        cd rom
        source build/envsetup.sh
        
        # Menyiapkan target untuk unified Blossom
        lunch lineage_blossom-userdebug
        
        # Mulai proses kompilasi zip ROM, output log diarahkan ke build.log
        brunch blossom 2>&1 | tee ../build.log

    - name: Unggah Berkas Hasil Build (.zip ROM)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: LineageOS-21-Blossom
        path: rom/out/target/product/blossom/*.zip

    - name: Pemrosesan Akhir Notifikasi & Berkas Telegram
      if: always()
      run: |
        CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
        TOKEN="${{ secrets.TELEGRAM_TOKEN }}"
        
        if [ "${{ job.status }}" == "success" ]; then
          ROM_FILE=$(ls rom/out/target/product/blossom/*.zip | head -n 1)
          ROM_NAME=$(basename "$ROM_FILE")
          
          echo "Mengunggah $ROM_NAME ke server temporary cloud..."
          DOWNLOAD_URL=$(curl -T "$ROM_FILE" "https://bashupload.com/$ROM_NAME")
          
          CAPTION=$(printf "✅ Build Succeeded!\nDevice: Blossom\nFile: %s\n\n📥 Download Link:\n%s" "$ROM_NAME" "$DOWNLOAD_URL")
          
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT" \
            -d text="$CAPTION"
        else
          # Jika gagal atau dibatalkan, siapkan berkas log
          if [ ! -f "build.log" ]; then
            if [ -f "rom/out/error.log" ]; then
              cp rom/out/error.log build.log
            else
              echo "Build stopped early or worker killed due to memory/disk limits." > build.log
              if [ -d "rom" ]; then
                echo "Last sync/build activities:" >> build.log
                tail -n 100 rom/.repo/repo.log 2>/dev/null >> build.log || echo "No repo logs found." >> build.log
              fi
            fi
          fi
          
          curl -s -F chat_id="$CHAT" \
            -F document=@build.log \
            -F caption="❌ Build failed or Worker Lost for Blossom. Check the log summary." \
            "https://api.telegram.org/bot${TOKEN}/sendDocument"
        fi
