name: Build LineageOS 20 Blossom

on:
  workflow_dispatch: # Memunculkan tombol manual di GitHub Actions HP

jobs:
  build_rom:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout Repo Pembangun
      uses: actions/checkout@v4

    - name: Kirim Notifikasi Mulai ke Telegram
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
        -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
        -d text="🚀 Build Started! Device: Blossom | Compiler: dre698-bot | Status: Preparing System (Android 13)..."

    - name: Bersihkan Storage Server (Hapus Bloatware Ubuntu)
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo docker image prune -a -f

    - name: Pasang Paket Dependensi Build System
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # Mengalihkan mirror ke Azure agar proses unduhan paket super cepat dan stabil
        sudo sed -i 's|http://archive.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list
        sudo sed -i 's|http://security.ubuntu.com|http://azure.archive.ubuntu.com|g' /etc/apt/sources.list
        
        sudo apt update
        sudo apt install -y -o Dpkg::Options::="--force-confnew" \
        bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf \
        lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 \
        libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
        python3 openjdk-17-jdk

    - name: Pasang Google Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Setel Identitas Git
      run: |
        git config --global user.name "dre698-bot"
        git config --global user.email "dre698@github.local"

    - name: Sync Source Android & Manifest Lokal Blossom
      run: |
        mkdir rom && cd rom
        # Inisialisasi base ROM LineageOS 20 (Android 13)
        repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1
        
        # Buat folder manifest lokal
        mkdir -p .repo/local_manifests
        
        # Injeksi manifes terpadu Blossom mengarah ke branch lineage-20 sesuai screenshot
        cat <<EOF > .repo/local_manifests/blossom.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project name="dre698/device_xiaomi_blossom" path="device/xiaomi/blossom" remote="github" revision="lineage-20" />
          <project name="dre698/proprietary_vendor_xiaomi_blossom" path="vendor/xiaomi/blossom" remote="github" revision="lineage-20" />
          <project name="dre698/device_xiaomi_blossom-kernel" path="kernel/xiaomi/blossom" remote="github" revision="lineage-20" />
        </manifest>
        EOF
        
        # Jalankan proses sinkronisasi kode sumber
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Jalankan Proses Kompilasi ROM
      run: |
        cd rom
        
        # Pastikan ccache mati agar memori disk aman dari file duplikat berukuran besar
        export USE_CCACHE=0
        
        source build/envsetup.sh
        
        # Menyiapkan target untuk unified Blossom
        lunch lineage_blossom-userdebug
        
        # Mulai proses kompilasi zip ROM, output log diarahkan ke build.log
        brunch blossom 2>&1 | tee ../build.log

    - name: Unggah Berkas Hasil Build (.zip ROM)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: LineageOS-20-Blossom
        path: rom/out/target/product/blossom/*.zip

    - name: Pemrosesan Akhir Notifikasi & Berkas Telegram
      if: always()
      run: |
        CHAT="${{ secrets.TELEGRAM_CHAT_ID }}"
        TOKEN="${{ secrets.TELEGRAM_TOKEN }}"
        
        if [ "${{ job.status }}" == "success" ]; then
          ROM_FILE=$(ls rom/out/target/product/blossom/*.zip | head -n 1)
          ROM_NAME=$(basename "$ROM_FILE")
          
          echo "Mengunggah $ROM_NAME ke server temporary cloud..."
          DOWNLOAD_URL=$(curl -T "$ROM_FILE" "https://bashupload.com/$ROM_NAME")
          
          CAPTION=$(printf "✅ Build Succeeded!\nDevice: Blossom (A13)\nFile: %s\n\n📥 Download Link:\n%s" "$ROM_NAME" "$DOWNLOAD_URL")
          
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT" \
            -d text="$CAPTION"
        else
          # Jika gagal atau dibatalkan, siapkan berkas log
          if [ ! -f "build.log" ]; then
            if [ -f "rom/out/error.log" ]; then
              cp rom/out/error.log build.log
            else
              echo "Build stopped early. Checking last 200 lines of setup:" > build.log
              tail -n 200 rom/out/verbose.log >> build.log 2>/dev/null || echo "No verbose log available." >> build.log
            fi
          fi
          
          curl -s -F chat_id="$CHAT" \
            -F document=@build.log \
            -F caption="❌ Build failed for Blossom (Android 13). Check the attached log for core errors." \
            "https://api.telegram.org/bot${TOKEN}/sendDocument"
        fi
