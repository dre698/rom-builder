name: Build LineageOS 20 for Blossom

on:
  workflow_dispatch: # Membuat tombol "Run workflow" manual di halaman GitHub Actions

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout Repositori
        uses: actions/checkout@v4

      - name: 2. Amankan Storage (Babat Bloatware Bawaan)
        run: |
          sudo systemctl stop docker || true
          # Bersihkan total aplikasi bawaan GitHub runner agar storage maksimal untuk sync
          sudo rm -rf /var/lib/docker /usr/libexec/docker /usr/share/miniconda /usr/local/share/powershell /usr/share/swift
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: 3. Pasang Tools Kompilasi & Perbaikan Ncurses
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib \
            gcc-multilib git gnupg gperf libxml2 libxml2-utils lzop rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev libssl-dev byobu tmux \
            python-is-python3 libncurses-dev imagemagick libelf-dev pkg-config pngcrush jq
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: 4. Inisialisasi Identitas Git & Repo Sync (Shallow Clone)
        run: |
          git config --global user.name "dre698"
          git config --global user.email "dre698@users.noreply.github.com"
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: 5. Clone Device, Vendor, Kernel, & SEPolicy Trees
        run: |
          git clone https://github.com/dre698/device_xiaomi_blossom.git -b lineage-20 device/xiaomi/blossom
          git clone https://github.com/dre698/proprietary_vendor_xiaomi_blossom.git -b lineage-20 vendor/xiaomi/blossom
          git clone https://github.com/dre698/device_xiaomi_blossom-kernel.git -b lineage-20 kernel/xiaomi/blossom-kernel
          git clone https://github.com/LineageOS/android_device_mediatek_sepolicy_vndr.git -b lineage-20 device/mediatek/sepolicy_vndr
          git clone https://github.com/LineageOS/android_hardware_mediatek.git -b lineage-20 hardware/mediatek
          
      - name: 6. Pembersihan Cache & Eksekusi Kompilasi ROM
        run: |
          # A. Hapus folder git cache (.repo) terlebih dahulu agar storage kembali kosong melompong
          rm -rf .repo

          cp device/xiaomi/blossom-kernel/Image.gz device/xiaomi/blossom-kernel/kernel
          
          # B. SEKARANG BARU BUAT SWAP 16GB (Storage sudah sangat aman karena .repo dihapus)
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          # C. Setup environment & penjinak Go Runtime agar anti-OOM
          . build/envsetup.sh
          export GOGC=20
          export GOFLAGS="-parallel=1"
          export GOMAXPROCS=1
          export WITHOUT_CHECK_API=true
          
          # D. Mulai Hajar Build!
          lunch lineage_blossom-user
          make bacon -j2

      - name: 7. Unggah Hasil Kompilasi ke GoFile
        run: |
          ZIP_FILE=$(ls out/target/product/blossom/*.zip | head -n 1)
          if [ -f "$ZIP_FILE" ]; then
            echo "Menemukan file ROM: $ZIP_FILE"
            echo "Mencari server GoFile terbaik..."
            SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
            echo "Mengunggah ke server: $SERVER"
            RESPONSE=$(curl -F "file=@$ZIP_FILE" "https://${SERVER}.gofile.io/contents/upload")
            DOWNLOAD_LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
            echo "=================================================="
            echo "PROSES BERHASIL! UNDUH ROM KAMU DI SINI:"
            echo "$DOWNLOAD_LINK"
            echo "=================================================="
          else
            echo "Error: File ZIP hasil kompilasi tidak ditemukan!"
            exit 1
          fi
